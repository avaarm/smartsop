name: Desktop release

# Build the SmartSOP desktop clients for macOS and Windows and attach the
# installers to a GitHub Release. Triggered by a version tag (e.g. v1.0.0) or
# manually. Each installer is built on its own OS runner — a Windows .exe cannot
# be cross-built reliably from macOS.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder needs to create the Release and upload the installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop dependencies
        run: npm install

      - name: Build installer (${{ matrix.target }})
        env:
          # electron-builder publishes to the repo's GitHub Releases on a tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds by default. Do NOT pass empty CSC_LINK/CSC_KEY_PASSWORD
          # here — electron-builder treats an empty cert path as a file and fails
          # ("<dir> not a file"). To sign & notarize macOS later, add a dedicated
          # signing step/secrets (see desktop/README.md); leave this false until then.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartsop-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: ignore
