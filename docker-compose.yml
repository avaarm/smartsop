services:
  # Angular SSR frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    # Bound to localhost only: in production the public entrypoint is Caddy
    # (docker-compose.prod.yml), which reaches this over the internal network.
    # For local dev the app is still at http://localhost:4000.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - API_URL=http://backend:5001
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

  # Flask GMP backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Apply DB migrations before serving, so the schema is always current and
    # the app never relies on create_all in production.
    command: ["sh", "-c", "flask --app gmp_server db upgrade && gunicorn --config gunicorn.conf.py gmp_server:app"]
    # Localhost-only: the backend is reached by the frontend/worker over the
    # internal network; it is never exposed publicly.
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - APP_ENV=production
      - FLASK_ENV=production
      - AUTO_CREATE_TABLES=false
      - OLLAMA_HOST=http://ollama:11434
      # Required: the app refuses to start in production without a real secret.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a real secret}
      - DATABASE_URL=postgresql://smartsop:smartsop@db:5432/smartsop
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - generated_docs:/app/generated_docs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # Ollama is optional (AI assist degrades gracefully): don't block backend
      # startup on it, so the app still boots when Ollama is omitted.

  # Celery worker — runs the long LLM tasks off the request path
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "gmp_server:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=postgresql://smartsop:smartsop@db:5432/smartsop
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTO_CREATE_TABLES=false
    volumes:
      - generated_docs:/app/generated_docs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # Ollama optional — see backend.

  # Redis — Celery broker + result backend
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # Postgres — shared by backend and worker
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=smartsop
      - POSTGRES_PASSWORD=smartsop
      - POSTGRES_DB=smartsop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    # Internal only — consumed by backend/worker over the compose network.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          memory: 4G

volumes:
  generated_docs:
  ollama_data:
  redis_data:
  postgres_data:
